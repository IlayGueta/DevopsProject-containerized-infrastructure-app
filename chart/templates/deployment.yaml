apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infrastructure-api.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "infrastructure-api.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "infrastructure-api.fullname" . }}

    spec:
      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.app.port }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.app.port }}